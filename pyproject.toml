[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-srm"
version = "2.0.0"
description = "Round-robin LLM persona interaction runner emitting SRM-ready data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyarrow>=14", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]
fetch = ["huggingface_hub>=0.23"]

[project.scripts]
agent_srm = "agent_srm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
